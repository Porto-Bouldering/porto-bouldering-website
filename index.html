<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porto Bouldering — Coming soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Rubik:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          160deg,
          #4a2e1c 0%,
          #2e1b10 55%,
          #1a0e07 100%
        );
        background-attachment: fixed;
        color: #e8dcc4;
        font-family: "Rubik Dirt", Impact, "Arial Black", sans-serif;
        text-align: center;
      }

      h1 {
        font-size: clamp(3rem, 12vw, 8rem);
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        line-height: 1;
      }

      .tagline {
        margin-top: 1.5rem;
        font-family: "Rubik", "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: clamp(0.9rem, 2.2vw, 1.25rem);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #c9b899;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brevemente</h1>
      <p class="tagline">Feito de pedra. 🪨</p>
    </main>
  </body>
</html>
